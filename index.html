<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D ASCII Art Cinematic Experience</title>
  <!-- Tailwind CSS for crisp UI controls & responsive framing -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: JetBrains Mono & Fira Code for authentic Hacker Terminal / ASCII aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-outer: #010205;
      --bg-stage: #03050a;
      --accent-glow: #38bdf8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-outer);
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }

    /* 9:16 Vertical Stage Container (1080x1920 Target Ratio) */
    #stage-wrapper {
      position: relative;
      height: 100vh;
      height: 100dvh;
      aspect-ratio: 9 / 16;
      max-width: 100vw;
      max-height: 100dvh;
      background: radial-gradient(circle at 50% 34%, #070d1d 0%, #03050a 65%, #010205 100%);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), 0 0 1px 1px rgba(56, 189, 248, 0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Full-bleed support on narrow portrait phones */
    @media (max-aspect-ratio: 9/16) {
      #stage-wrapper {
        width: 100vw;
        height: 100dvh;
        aspect-ratio: auto;
        box-shadow: none;
      }
    }

    /* Main 3D ASCII Canvas Area (Top ~67% of 9:16 frame) */
    #canvas-container {
      position: relative;
      width: 100%;
      height: 67%;
      flex-shrink: 0;
      cursor: grab;
      touch-action: none;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    canvas#ascii-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Subtle CRT Scanline & Vignette overlay for cinematic depth */
    .crt-overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.22) 50%
      );
      background-size: 100% 3px;
      opacity: 0.35;
      z-index: 5;
    }

    /* Glowing Divider Line between 3D Stage and Code Terminal */
    #terminal-divider {
      height: 2px;
      width: 100%;
      background: linear-gradient(90deg, transparent 0%, #10b981 25%, #38bdf8 50%, #10b981 75%, transparent 100%);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.75), 0 0 24px rgba(16, 185, 129, 0.45);
      flex-shrink: 0;
      z-index: 10;
    }

    /* Bottom Code Editor Visualization (~33% of 9:16 frame) */
    #code-terminal {
      position: relative;
      width: 100%;
      height: calc(33% - 2px);
      background: linear-gradient(180deg, #04070f 0%, #020408 100%);
      display: flex;
      flex-direction: column;
      font-size: clamp(9.5px, 1.45vh, 12.5px);
      line-height: 1.48;
      z-index: 10;
      overflow: hidden;
    }

    /* Syntax Highlighting Colors */
    .tok-kw { color: #f472b6; font-weight: 600; }      /* def, for, in, if, return */
    .tok-fn { color: #38bdf8; }                       /* function names */
    .tok-str { color: #fbbf24; }                      /* strings & ASCII chars */
    .tok-num { color: #34d399; }                      /* numbers */
    .tok-op { color: #94a3b8; }                       /* operators */
    .tok-cm { color: #475569; font-style: italic; }   /* comments */
    .tok-var { color: #e2e8f0; }                      /* variables */
    .tok-cls { color: #a78bfa; font-weight: 600; }    /* classes / constants */

    /* Active executing line highlight in Code Editor */
    .code-line {
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-left: 2px solid transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      white-space: pre;
    }

    .code-line.active-exec {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.16) 0%, rgba(56, 189, 248, 0.06) 85%, transparent 100%);
      border-left-color: #10b981;
    }

    .line-num {
      display: inline-block;
      width: 24px;
      color: #334155;
      text-align: right;
      margin-right: 12px;
      flex-shrink: 0;
      font-size: 0.9em;
    }

    .code-line.active-exec .line-num {
      color: #34d399;
      font-weight: 700;
    }

    /* Custom Range Sliders for Settings Drawer */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      background: #1e293b;
      border-radius: 999px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
      cursor: pointer;
    }

    /* Hide scrollbars cleanly */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    .status-dot {
      animation: pulseDot 1.4s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <!-- 9:16 Vertical Frame Wrapper -->
  <div id="stage-wrapper">

    <!-- Top Interactive 3D ASCII Viewport -->
    <div id="canvas-container">
      <canvas id="ascii-canvas"></canvas>
      <div class="crt-overlay"></div>

      <!-- Subtle Minimalist Floating Gear Button (Discreet for clean screen recording) -->
      <button
        id="open-settings-btn"
        title="Open Creative Controls"
        class="absolute top-3 right-3 z-20 p-2.5 rounded-xl bg-slate-950/55 hover:bg-slate-900/90 border border-slate-700/50 text-slate-300 hover:text-cyan-300 backdrop-blur-md transition-all active:scale-95 shadow-lg"
        aria-label="Settings"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <!-- Glowing Neon Divider -->
    <div id="terminal-divider"></div>

    <!-- Bottom Hacker Terminal / Live Code Editor Visualization -->
    <div id="code-terminal">
      <!-- Editor Top Tab Bar -->
      <div class="flex items-center justify-between px-3 py-1.5 bg-[#070b14] border-b border-slate-800/80 shrink-0">
        <div class="flex items-center gap-2">
          <!-- Window control dots -->
          <div class="flex items-center gap-1.5 mr-1">
            <span class="w-2.5 h-2.5 rounded-full bg-rose-500/85 inline-block"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-amber-400/85 inline-block"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400/85 inline-block"></span>
          </div>
          <!-- Active Python Script Tab -->
          <div class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-md bg-slate-900/90 border border-slate-700/60 text-cyan-300 font-semibold text-[11px]">
            <span class="text-amber-400">🐍</span>
            <span id="editor-filename">christmas_tree.py</span>
          </div>
        </div>

        <!-- Telemetry: RUNNING status & Live FPS -->
        <div class="flex items-center gap-2.5 text-[10px] font-bold tracking-wider">
          <div id="status-badge" class="flex items-center gap-1.5 px-2 py-0.5 rounded bg-emerald-950/80 border border-emerald-500/40 text-emerald-400">
            <span id="status-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-400 status-dot"></span>
            <span id="status-text">RUNNING</span>
          </div>
          <div class="px-2 py-0.5 rounded bg-slate-900 border border-slate-700/70 text-cyan-300">
            <span id="fps-counter">60</span> FPS
          </div>
        </div>
      </div>

      <!-- Live Syntax-Highlighted Code Body -->
      <div id="code-lines-container" class="flex-1 py-1.5 overflow-hidden flex flex-col justify-center select-none">
        <!-- Populated dynamically by CodeEditorVisualizer -->
      </div>

      <!-- Subtle Terminal Footer Telemetry Bar -->
      <div class="flex items-center justify-between px-3 py-1 bg-[#03060c] border-t border-slate-800/60 text-[9.5px] text-slate-500 shrink-0">
        <span id="telemetry-verts">VERTICES: 0 | DEPTH-SORT: PAINTER</span>
        <span id="telemetry-phase" class="text-cyan-400/80">PHASE: RENDER_LOOP</span>
      </div>
    </div>

    <!-- Collapsible Settings Drawer Overlay -->
    <div
      id="settings-drawer"
      class="absolute inset-0 z-30 bg-slate-950/85 backdrop-blur-xl transition-all duration-300 opacity-0 pointer-events-none flex flex-col justify-between p-4 overflow-y-auto no-scrollbar"
    >
      <div>
        <!-- Drawer Header -->
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
          <div>
            <h2 class="text-sm font-bold tracking-wider text-cyan-300 flex items-center gap-2">
              <span>⚡</span> ASCII ENGINE CONTROLS
            </h2>
            <p class="text-[10px] text-slate-400 mt-0.5">9:16 Cinema Mode • Drag canvas to rotate</p>
          </div>
          <button
            id="close-settings-btn"
            class="p-2 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 hover:text-white transition"
          >
            ✕
          </button>
        </div>

        <!-- Controls Grid -->
        <div class="space-y-3 text-xs">
          <!-- 3D ASCII Object Selector -->
          <div>
            <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1.5 font-semibold">3D Procedural Model</label>
            <div class="grid grid-cols-2 gap-1.5" id="model-buttons">
              <button data-model="tree" class="model-btn px-2.5 py-2 rounded-lg border text-left font-medium transition flex items-center gap-1.5 bg-cyan-500/20 border-cyan-400 text-cyan-200">
                <span>🎄</span> Christmas Tree
              </button>
              <button data-model="earth" class="model-btn px-2.5 py-2 rounded-lg border border-slate-800 bg-slate-900/80 text-slate-300 hover:border-slate-600 text-left font-medium transition flex items-center gap-1.5">
                <span>🌍</span> Earth Globe
              </button>
              <button data-model="heart" class="model-btn px-2.5 py-2 rounded-lg border border-slate-800 bg-slate-900/80 text-slate-300 hover:border-slate-600 text-left font-medium transition flex items-center gap-1.5">
                <span>❤️</span> Cyber Heart
              </button>
              <button data-model="saturn" class="model-btn px-2.5 py-2 rounded-lg border border-slate-800 bg-slate-900/80 text-slate-300 hover:border-slate-600 text-left font-medium transition flex items-center gap-1.5">
                <span>🪐</span> Saturn Planet
              </button>
              <button data-model="knot" class="model-btn col-span-2 px-2.5 py-2 rounded-lg border border-slate-800 bg-slate-900/80 text-slate-300 hover:border-slate-600 text-left font-medium transition flex items-center gap-1.5">
                <span>🌀</span> Sacred Torus Knot
              </button>
            </div>
          </div>

          <!-- Custom Cinematic Text -->
          <div>
            <label for="cinematic-text-input" class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">Cinematic Caption</label>
            <div class="flex gap-1.5">
              <input
                id="cinematic-text-input"
                type="text"
                maxlength="32"
                value="MERRY CHRISTMAS 2026"
                class="flex-1 px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-amber-300 font-bold tracking-wider text-xs focus:outline-none focus:border-cyan-400"
              />
              <button
                id="apply-text-btn"
                class="px-3 py-1.5 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-400/60 text-cyan-300 font-semibold text-xs transition"
              >
                Replay
              </button>
            </div>
          </div>

          <!-- Color Theme Selector -->
          <div>
            <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1.5 font-semibold">Color Palette Theme</label>
            <div class="grid grid-cols-2 gap-1.5" id="theme-buttons">
              <button data-theme="holiday" class="theme-btn px-2.5 py-1.5 rounded-lg border bg-emerald-500/20 border-emerald-400 text-emerald-200 text-[11px] font-medium transition">
                ✨ Classic Holiday
              </button>
              <button data-theme="cyberpunk" class="theme-btn px-2.5 py-1.5 rounded-lg border border-slate-800 bg-slate-900/80 text-slate-300 text-[11px] font-medium transition">
                🔮 Cyberpunk Neon
              </button>
              <button data-theme="matrix" class="theme-btn px-2.5 py-1.5 rounded-lg border border-slate-800 bg-slate-900/80 text-slate-300 text-[11px] font-medium transition">
                📟 Matrix Emerald
              </button>
              <button data-theme="solar" class="theme-btn px-2.5 py-1.5 rounded-lg border border-slate-800 bg-slate-900/80 text-slate-300 text-[11px] font-medium transition">
                ☀️ Solar Gold
              </button>
            </div>
          </div>

          <!-- Sliders -->
          <div class="grid grid-cols-2 gap-3 pt-1">
            <div>
              <div class="flex justify-between text-[10px] text-slate-400 mb-1">
                <span>Rotation Speed</span>
                <span id="val-speed" class="text-cyan-300">1.0x</span>
              </div>
              <input id="slider-speed" type="range" min="0" max="3" step="0.1" value="1.0" />
            </div>

            <div>
              <div class="flex justify-between text-[10px] text-slate-400 mb-1">
                <span>ASCII Density</span>
                <span id="val-density" class="text-cyan-300">100%</span>
              </div>
              <input id="slider-density" type="range" min="0.55" max="1.45" step="0.05" value="1.0" />
            </div>

            <div>
              <div class="flex justify-between text-[10px] text-slate-400 mb-1">
                <span>Starfield Count</span>
                <span id="val-stars" class="text-cyan-300">160</span>
              </div>
              <input id="slider-stars" type="range" min="40" max="320" step="10" value="160" />
            </div>

            <div>
              <div class="flex justify-between text-[10px] text-slate-400 mb-1">
                <span>Glow Intensity</span>
                <span id="val-glow" class="text-cyan-300">1.0x</span>
              </div>
              <input id="slider-glow" type="range" min="0" max="1.8" step="0.1" value="1.0" />
            </div>
          </div>

          <!-- Particles Toggle & Playback Actions -->
          <div class="flex items-center justify-between pt-2 border-t border-slate-800/80">
            <label class="flex items-center gap-2 cursor-pointer">
              <input id="toggle-particles" type="checkbox" checked class="w-4 h-4 accent-cyan-400 rounded" />
              <span class="text-xs text-slate-300">Ambient Particles & Snow</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Bottom Action Buttons -->
      <div class="grid grid-cols-3 gap-2 pt-3 mt-3 border-t border-slate-800">
        <button
          id="btn-play-pause"
          class="py-2 px-2 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/50 text-emerald-300 font-bold text-xs transition"
        >
          ⏸ Pause
        </button>
        <button
          id="btn-reset"
          class="py-2 px-2 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/50 text-amber-300 font-bold text-xs transition"
        >
          ↺ Replay
        </button>
        <button
          id="btn-hide-ui"
          class="py-2 px-2 rounded-lg bg-cyan-500/25 hover:bg-cyan-500/40 border border-cyan-400/60 text-cyan-200 font-bold text-xs transition"
        >
          🎬 Record
        </button>
      </div>
    </div>

  </div>

  <!-- Modular JavaScript Engine -->
  <script>
    /**
     * ============================================================================
     * MODULE 1: STATE & CONFIGURATION (settings.js)
     * Centralized reactive state for the 3D ASCII Cinema Engine
     * ============================================================================
     */
    const AppState = {
      model: 'tree', // 'tree' | 'earth' | 'heart' | 'saturn' | 'knot'
      caption: 'MERRY CHRISTMAS 2026',
      theme: 'holiday', // 'holiday' | 'cyberpunk' | 'matrix' | 'solar'
      rotationSpeed: 1.0,
      density: 1.0,
      starCount: 160,
      glowIntensity: 1.0,
      particlesEnabled: true,
      isPlaying: true,

      // Interactive camera / rotation offsets
      rotX: 0.12,
      rotY: 0,
      rotZ: 0,
      zoom: 1.0,
      isDragging: false,
      lastPointerX: 0,
      lastPointerY: 0,
      velocityY: 0,

      // Timeline & Animation Phases
      elapsedTime: 0,
      formationProgress: 0, // 0 -> 1 builds the 3D object from bottom/center
      textRevealProgress: 0, // 0 -> 1 reveals cinematic typography
      activeCodeLine: 0,
      fps: 60
    };

    const MODEL_DEFAULT_CAPTIONS = {
      tree: 'MERRY CHRISTMAS 2026',
      earth: 'PLANET EARTH • 3D ASCII',
      heart: 'DIGITAL HEARTBEAT 2026',
      saturn: 'COSMIC SATURN RINGS',
      knot: 'SACRED GEOMETRY 3D'
    };

    const THEMES = {
      holiday: {
        primary: ['#059669', '#10b981', '#34d399', '#6ee7b7'],
        secondary: ['#fbbf24', '#f59e0b', '#fef08a'],
        accentA: '#ef4444',
        accentB: '#38bdf8',
        textPrimary: '#fbbf24',
        textSecondary: '#ef4444',
        particle: '#f8fafc',
        bgGlow: 'rgba(16, 185, 129, 0.08)'
      },
      cyberpunk: {
        primary: ['#0284c7', '#06b6d4', '#22d3ee', '#67e8f9'],
        secondary: ['#f472b6', '#e879f9', '#f0abfc'],
        accentA: '#f43f5e',
        accentB: '#a855f7',
        textPrimary: '#22d3ee',
        textSecondary: '#f472b6',
        particle: '#e879f9',
        bgGlow: 'rgba(6, 182, 212, 0.1)'
      },
      matrix: {
        primary: ['#065f46', '#059669', '#10b981', '#4ade80'],
        secondary: ['#bbf7d0', '#86efac', '#22c55e'],
        accentA: '#a3e635',
        accentB: '#34d399',
        textPrimary: '#4ade80',
        textSecondary: '#bbf7d0',
        particle: '#4ade80',
        bgGlow: 'rgba(16, 185, 129, 0.1)'
      },
      solar: {
        primary: ['#b45309', '#d97706', '#f59e0b', '#fbbf24'],
        secondary: ['#fef08a', '#fde047', '#fb923c'],
        accentA: '#ef4444',
        accentB: '#fef9c3',
        textPrimary: '#fde047',
        textSecondary: '#fb923c',
        particle: '#fef08a',
        bgGlow: 'rgba(245, 158, 11, 0.09)'
      }
    };

    /**
     * ============================================================================
     * MODULE 2: 3D PROCEDURAL ASCII OBJECT GENERATORS (objects.js)
     * Generates 3D point clouds with surface normals, roles, and ASCII glyphs
     * ============================================================================
     */
    class AsciiObjectFactory {
      static generate(modelType, density = 1.0) {
        switch (modelType) {
          case 'earth':
            return this.createEarthGlobe(density);
          case 'heart':
            return this.createCyberHeart(density);
          case 'saturn':
            return this.createSaturnPlanet(density);
          case 'knot':
            return this.createTorusKnot(density);
          case 'tree':
          default:
            return this.createChristmasTree(density);
        }
      }

      /**
       * 1. CHRISTMAS TREE: Layered pine boughs, golden 3D star, blinking lights, ornaments, & gift boxes
       */
      static createChristmasTree(density) {
        const points = [];
        const tiers = 7;
        const treeHeight = 250;
        const startY = -125; // Top of foliage

        // Trunk
        const trunkRows = Math.round(10 * density);
        const trunkCols = Math.round(14 * density);
        for (let r = 0; r < trunkRows; r++) {
          const y = 115 + (r / trunkRows) * 32;
          for (let c = 0; c < trunkCols; c++) {
            const angle = (c / trunkCols) * Math.PI * 2;
            const rad = 16;
            points.push({
              x: Math.cos(angle) * rad,
              y,
              z: Math.sin(angle) * rad,
              nx: Math.cos(angle),
              ny: 0,
              nz: Math.sin(angle),
              char: '#',
              role: 'trunk',
              order: 0.05
            });
          }
        }

        // Layered Conical Foliage Tiers
        for (let t = 0; t < tiers; t++) {
          const tierProgress = t / tiers;
          const tierTopY = startY + tierProgress * (treeHeight * 0.82);
          const tierHeight = (treeHeight / tiers) * 1.48;
          const maxRadius = 26 + tierProgress * 92;
          const rings = Math.max(5, Math.round(10 * density));

          for (let r = 0; r <= rings; r++) {
            const v = r / rings;
            const y = tierTopY + v * tierHeight;
            // Slight upward curve at bough tips
            const radius = v * maxRadius * (1 + 0.08 * Math.sin(v * Math.PI));
            const circumference = Math.max(8, Math.round((2 * Math.PI * radius) / (7.5 / density)));

            for (let c = 0; c < circumference; c++) {
              const theta = (c / circumference) * Math.PI * 2 + t * 0.45;
              // Scalloped pine branch wave
              const scallop = 1 + 0.12 * Math.sin(theta * (5 + t));
              const px = Math.cos(theta) * radius * scallop;
              const pz = Math.sin(theta) * radius * scallop;

              // Determine if this point is an ornament / fairy light or pine foliage
              const hash = Math.abs(Math.sin(t * 91.7 + r * 37.3 + c * 19.1));
              let role = 'foliage';
              let char = hash > 0.65 ? '#' : hash > 0.35 ? '%' : '&';
              let lightIndex = 0;

              if (v > 0.72 && hash > 0.86) {
                role = 'ornament';
                char = '@';
                lightIndex = (t + c) % 4;
              } else if (hash > 0.79 && hash <= 0.86) {
                role = 'light';
                char = '*';
                lightIndex = (r + c) % 4;
              }

              points.push({
                x: px,
                y,
                z: pz,
                nx: Math.cos(theta) * 0.85,
                ny: -0.35,
                nz: Math.sin(theta) * 0.85,
                char,
                role,
                lightIndex,
                shadeSeed: hash,
                order: 1 - (y - startY) / (treeHeight + 40)
              });
            }
          }
        }

        // Golden 3D Star Topper at (0, -142, 0)
        const starY = startY - 18;
        const starPoints = 5;
        for (let layer = -1; layer <= 1; layer++) {
          const zDepth = layer * 4.5;
          const scale = layer === 0 ? 1.0 : 0.65;
          for (let i = 0; i < starPoints * 2; i++) {
            const isOuter = i % 2 === 0;
            const r = (isOuter ? 24 : 10) * scale;
            const angle = (i * Math.PI) / starPoints - Math.PI / 2;
            const steps = Math.round(5 * density);
            for (let s = 1; s <= steps; s++) {
              const frac = s / steps;
              points.push({
                x: Math.cos(angle) * r * frac,
                y: starY + Math.sin(angle) * r * frac,
                z: zDepth * (1 - frac * 0.4),
                nx: Math.cos(angle),
                ny: Math.sin(angle),
                nz: layer === 0 ? 1 : layer,
                char: isOuter && s === steps ? '★' : '*',
                role: 'star',
                order: 0.98
              });
            }
          }
        }

        // Gift Boxes at the base of the tree
        const gifts = [
          { cx: -48, cy: 135, cz: 32, w: 28, h: 24, d: 28, colorRole: 'giftRed' },
          { cx: 46, cy: 137, cz: 26, w: 26, h: 20, d: 26, colorRole: 'giftBlue' },
          { cx: 12, cy: 139, cz: -44, w: 24, h: 18, d: 24, colorRole: 'giftGold' }
        ];

        const boxStep = Math.max(4, Math.round(6 / density));
        gifts.forEach((g) => {
          for (let dx = -g.w / 2; dx <= g.w / 2; dx += boxStep) {
            for (let dy = -g.h / 2; dy <= g.h / 2; dy += boxStep) {
              for (let dz = -g.d / 2; dz <= g.d / 2; dz += boxStep) {
                const onEdgeX = Math.abs(Math.abs(dx) - g.w / 2) < boxStep;
                const onEdgeY = Math.abs(Math.abs(dy) - g.h / 2) < boxStep;
                const onEdgeZ = Math.abs(Math.abs(dz) - g.d / 2) < boxStep;
                if (!onEdgeX && !onEdgeY && !onEdgeZ) continue;

                const isRibbon = Math.abs(dx) < 3.5 || Math.abs(dz) < 3.5;
                points.push({
                  x: g.cx + dx,
                  y: g.cy + dy,
                  z: g.cz + dz,
                  nx: dx / (g.w / 2),
                  ny: dy / (g.h / 2),
                  nz: dz / (g.d / 2),
                  char: isRibbon ? '+' : '0',
                  role: isRibbon ? 'ribbon' : g.colorRole,
                  order: 0.08
                });
              }
            }
          }
        });

        return points;
      }

      /**
       * 2. EARTH GLOBE: Rotating 3D sphere with procedural continents, oceans & orbital ring
       */
      static createEarthGlobe(density) {
        const points = [];
        const radius = 112;
        const latSteps = Math.round(34 * density);

        for (let i = 1; i < latSteps; i++) {
          const phi = (i / latSteps) * Math.PI;
          const y = -Math.cos(phi) * radius;
          const ringRadius = Math.sin(phi) * radius;
          const lonSteps = Math.max(8, Math.round((2 * Math.PI * ringRadius) / (7.2 / density)));

          for (let j = 0; j < lonSteps; j++) {
            const theta = (j / lonSteps) * Math.PI * 2;
            const x = Math.cos(theta) * ringRadius;
            const z = Math.sin(theta) * ringRadius;

            // Procedural harmonic noise for realistic continental landmasses
            const continentNoise =
              Math.sin(theta * 2.0 + 0.5) * Math.cos(phi * 2.5) +
              0.5 * Math.sin(theta * 5.0 - phi * 3.0) +
              0.35 * Math.cos(theta * 3.0 + phi * 4.0);

            const isPolarIce = phi < 0.24 || phi > Math.PI - 0.24;
            const isLand = continentNoise > 0.16;

            let role = 'ocean';
            let char = '~';
            if (isPolarIce) {
              role = 'star';
              char = '#';
            } else if (isLand) {
              role = 'foliage';
              char = continentNoise > 0.45 ? '@' : '%';
            }

            points.push({
              x,
              y,
              z,
              nx: x / radius,
              ny: y / radius,
              nz: z / radius,
              char,
              role,
              shadeSeed: Math.abs(continentNoise),
              order: 1 - i / latSteps
            });
          }
        }

        // Orbital Satellite Ring
        const ringCount = Math.round(64 * density);
        for (let k = 0; k < ringCount; k++) {
          const a = (k / ringCount) * Math.PI * 2;
          const rx = Math.cos(a) * 145;
          const rz = Math.sin(a) * 145;
          const ry = Math.sin(a * 2) * 18;
          points.push({
            x: rx,
            y: ry,
            z: rz,
            nx: 0,
            ny: 1,
            nz: 0,
            char: k % 8 === 0 ? '★' : '+',
            role: k % 8 === 0 ? 'star' : 'light',
            lightIndex: k % 4,
            order: 0.5
          });
        }

        return points;
      }

      /**
       * 3. CYBER HEART: Parametric 3D volumetric heart with glowing contours
       */
      static createCyberHeart(density) {
        const points = [];
        const uSteps = Math.round(48 * density);
        const vSteps = Math.round(24 * density);

        for (let i = 0; i < uSteps; i++) {
          const t = (i / uSteps) * Math.PI * 2;
          // Classic parametric heart contour
          const hx = 16 * Math.pow(Math.sin(t), 3);
          const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

          for (let j = 1; j < vSteps; j++) {
            const v = (j / vSteps) * Math.PI;
            const shell = Math.sin(v);
            const z = Math.cos(v) * 48 * (1 - 0.25 * Math.abs(hy) / 18);

            const scale = 6.8;
            const x = hx * shell * scale;
            const y = (hy * shell * scale) - 10;

            const isEdge = Math.abs(Math.cos(v)) < 0.22;
            points.push({
              x,
              y,
              z,
              nx: hx * 0.06,
              ny: hy * 0.06,
              nz: Math.cos(v),
              char: isEdge ? '@' : (i + j) % 2 === 0 ? '#' : '%',
              role: isEdge ? 'star' : 'giftRed',
              lightIndex: (i + j) % 4,
              shadeSeed: shell,
              order: 1 - (y + 130) / 260
            });
          }
        }
        return points;
      }

      /**
       * 4. SATURN PLANET: Banded gas giant sphere + tilted multi-band ASCII ring system
       */
      static createSaturnPlanet(density) {
        const points = [];
        const radius = 78;
        const latSteps = Math.round(28 * density);

        // Planet Sphere
        for (let i = 1; i < latSteps; i++) {
          const phi = (i / latSteps) * Math.PI;
          const y = -Math.cos(phi) * radius;
          const r = Math.sin(phi) * radius;
          const lonSteps = Math.max(8, Math.round((2 * Math.PI * r) / (7.5 / density)));

          for (let j = 0; j < lonSteps; j++) {
            const theta = (j / lonSteps) * Math.PI * 2;
            const x = Math.cos(theta) * r;
            const z = Math.sin(theta) * r;
            const band = Math.sin(phi * 14);

            points.push({
              x,
              y,
              z,
              nx: x / radius,
              ny: y / radius,
              nz: z / radius,
              char: band > 0.2 ? '#' : band > -0.3 ? '%' : '&',
              role: band > 0.3 ? 'star' : 'giftGold',
              shadeSeed: (band + 1) * 0.5,
              order: 1 - i / latSteps
            });
          }
        }

        // Tilted Concentric Rings
        const ringRadii = [102, 112, 122, 136, 146, 156];
        const tilt = 0.42;
        ringRadii.forEach((rr, idx) => {
          const count = Math.round((2 * Math.PI * rr) / (6.8 / density));
          for (let k = 0; k < count; k++) {
            const theta = (k / count) * Math.PI * 2;
            const rx = Math.cos(theta) * rr;
            const rz0 = Math.sin(theta) * rr;
            // Apply axial tilt
            const ry = rz0 * Math.sin(tilt);
            const rz = rz0 * Math.cos(tilt);

            points.push({
              x: rx,
              y: ry,
              z: rz,
              nx: 0,
              ny: Math.cos(tilt),
              nz: -Math.sin(tilt),
              char: idx % 2 === 0 ? '*' : '+',
              role: idx === 3 ? 'star' : 'light',
              lightIndex: idx % 4,
              order: 0.5
            });
          }
        });

        return points;
      }

      /**
       * 5. SACRED TORUS KNOT: Complex (p=3, q=4) 3D mathematical knot
       */
      static createTorusKnot(density) {
        const points = [];
        const p = 3;
        const q = 4;
        const steps = Math.round(220 * density);
        const tubeSegments = Math.max(6, Math.round(10 * density));
        const tubeRadius = 18;

        for (let i = 0; i < steps; i++) {
          const u = (i / steps) * Math.PI * 2;
          const r = 68 + 28 * Math.cos(q * u);
          const cx = r * Math.cos(p * u);
          const cy = r * Math.sin(p * u);
          const cz = 42 * Math.sin(q * u);

          // Approximate tangent
          const uNext = u + 0.02;
          const rNext = 68 + 28 * Math.cos(q * uNext);
          const tx = rNext * Math.cos(p * uNext) - cx;
          const ty = rNext * Math.sin(p * uNext) - cy;
          const tz = 42 * Math.sin(q * uNext) - cz;
          const tLen = Math.hypot(tx, ty, tz) || 1;
          const nx0 = -ty / tLen;
          const ny0 = tx / tLen;

          for (let j = 0; j < tubeSegments; j++) {
            const v = (j / tubeSegments) * Math.PI * 2;
            const ox = (nx0 * Math.cos(v)) * tubeRadius;
            const oy = (ny0 * Math.cos(v)) * tubeRadius;
            const oz = Math.sin(v) * tubeRadius;

            points.push({
              x: cx + ox,
              y: cy + oy,
              z: cz + oz,
              nx: ox / tubeRadius,
              ny: oy / tubeRadius,
              nz: oz / tubeRadius,
              char: j % 2 === 0 ? '@' : '#',
              role: 'light',
              lightIndex: Math.floor((i / steps) * 4) % 4,
              shadeSeed: i / steps,
              order: i / steps
            });
          }
        }
        return points;
      }
    }

    /**
     * ============================================================================
     * MODULE 3: PARTICLE & STARFIELD SYSTEM (particles.js)
     * Manages twinkling background stars, shooting stars, snow, & orbital sparks
     * ============================================================================
     */
    class ParticleEngine {
      constructor() {
        this.stars = [];
        this.shootingStars = [];
        this.ambientParticles = [];
        this.burstParticles = [];
        this.initStars(AppState.starCount);
        this.initAmbientParticles(65);
      }

      initStars(count) {
        this.stars = [];
        for (let i = 0; i < count; i++) {
          this.stars.push({
            nx: Math.random(),
            ny: Math.random(),
            size: Math.random() < 0.2 ? 2.1 : 1.2,
            phase: Math.random() * Math.PI * 2,
            speed: 1.5 + Math.random() * 3.5,
            isCross: Math.random() < 0.14,
            hue: Math.random() < 0.25 ? '#bae6fd' : Math.random() < 0.15 ? '#fef08a' : '#ffffff'
          });
        }
      }

      initAmbientParticles(count) {
        this.ambientParticles = [];
        const glyphs = ['*', '+', '·', '✦', '•', '°'];
        for (let i = 0; i < count; i++) {
          this.ambientParticles.push(this.createAmbientParticle(true, glyphs));
        }
      }

      createAmbientParticle(randomY = false, glyphs = ['*', '+', '·', '✦', '•']) {
        const isOrbiting = Math.random() < 0.45;
        return {
          isOrbiting,
          // Falling snow / rising spark properties
          nx: Math.random(),
          ny: randomY ? Math.random() : -0.05,
          vx: (Math.random() - 0.5) * 0.04,
          vy: 0.05 + Math.random() * 0.08,
          // Orbital properties around 3D object
          angle: Math.random() * Math.PI * 2,
          orbitRadius: 70 + Math.random() * 95,
          orbitY: (Math.random() - 0.5) * 260,
          orbitSpeed: (0.4 + Math.random() * 0.8) * (Math.random() < 0.5 ? 1 : -1),
          glyph: glyphs[Math.floor(Math.random() * glyphs.length)],
          size: 8 + Math.random() * 5,
          alpha: 0.35 + Math.random() * 0.65,
          phase: Math.random() * Math.PI * 2
        };
      }

      triggerSparkBurst(count = 28) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 45 + Math.random() * 140;
          this.burstParticles.push({
            x: 0,
            y: -30,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 30,
            life: 1.0,
            decay: 0.7 + Math.random() * 0.6,
            glyph: Math.random() < 0.5 ? '✦' : '*'
          });
        }
      }

      update(dt, time) {
        // Spawn occasional shooting star
        if (Math.random() < dt * 0.45 && this.shootingStars.length < 2) {
          this.shootingStars.push({
            nx: 0.1 + Math.random() * 0.8,
            ny: 0.05 + Math.random() * 0.35,
            vx: (Math.random() < 0.5 ? 1 : -1) * (0.45 + Math.random() * 0.35),
            vy: 0.25 + Math.random() * 0.25,
            life: 1.0,
            length: 55 + Math.random() * 45
          });
        }

        // Update shooting stars
        for (let i = this.shootingStars.length - 1; i >= 0; i--) {
          const s = this.shootingStars[i];
          s.nx += s.vx * dt;
          s.ny += s.vy * dt;
          s.life -= dt * 1.15;
          if (s.life <= 0) this.shootingStars.splice(i, 1);
        }

        // Update ambient snow / sparks
        if (AppState.particlesEnabled) {
          for (let p of this.ambientParticles) {
            if (p.isOrbiting) {
              p.angle += p.orbitSpeed * dt;
              p.orbitY -= dt * 14;
              if (p.orbitY < -155) p.orbitY = 155;
            } else {
              p.nx += p.vx * dt + Math.sin(time * 1.5 + p.phase) * 0.015 * dt;
              p.ny += p.vy * dt;
              if (p.ny > 1.05) {
                p.ny = -0.04;
                p.nx = Math.random();
              }
            }
          }
        }

        // Update burst particles
        for (let i = this.burstParticles.length - 1; i >= 0; i--) {
          const b = this.burstParticles[i];
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.vy += 65 * dt; // subtle gravity
          b.life -= b.decay * dt;
          if (b.life <= 0) this.burstParticles.splice(i, 1);
        }
      }

      renderBackground(ctx, width, height, time) {
        // Twinkling Stars
        for (const star of this.stars) {
          const twinkle = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(time * star.speed + star.phase));
          const sx = star.nx * width;
          const sy = star.ny * height;

          ctx.save();
          ctx.globalAlpha = twinkle;
          ctx.fillStyle = star.hue;

          if (star.isCross && twinkle > 0.72) {
            ctx.font = '10px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('✦', sx, sy);
          } else {
            ctx.beginPath();
            ctx.arc(sx, sy, star.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // Shooting Stars
        for (const s of this.shootingStars) {
          const x1 = s.nx * width;
          const y1 = s.ny * height;
          const norm = Math.hypot(s.vx, s.vy) || 1;
          const x2 = x1 - (s.vx / norm) * s.length;
          const y2 = y1 - (s.vy / norm) * s.length;

          const grad = ctx.createLinearGradient(x1, y1, x2, y2);
          grad.addColorStop(0, `rgba(255, 255, 255, ${s.life})`);
          grad.addColorStop(0.4, `rgba(56, 189, 248, ${s.life * 0.6})`);
          grad.addColorStop(1, 'rgba(56, 189, 248, 0)');

          ctx.save();
          ctx.strokeStyle = grad;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          ctx.restore();
        }
      }

      renderForegroundParticles(ctx, width, height, centerX, centerY, scaleFactor, time) {
        if (!AppState.particlesEnabled) return;
        const theme = THEMES[AppState.theme];

        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (const p of this.ambientParticles) {
          const pulse = 0.5 + 0.5 * Math.sin(time * 3 + p.phase);
          ctx.globalAlpha = p.alpha * (0.4 + 0.6 * pulse);
          ctx.fillStyle = p.isOrbiting ? theme.secondary[0] : theme.particle;
          ctx.font = `${Math.round(p.size * scaleFactor)}px "JetBrains Mono", monospace`;

          if (p.isOrbiting) {
            const ox = Math.cos(p.angle) * p.orbitRadius * scaleFactor;
            const oz = Math.sin(p.angle) * p.orbitRadius;
            // Only draw front-half orbiting particles here
            if (oz > 0) {
              ctx.fillText(p.glyph, centerX + ox, centerY + p.orbitY * scaleFactor);
            }
          } else {
            ctx.fillText(p.glyph, p.nx * width, p.ny * height);
          }
        }

        // Spark Burst particles
        for (const b of this.burstParticles) {
          ctx.globalAlpha = Math.max(0, b.life);
          ctx.fillStyle = theme.secondary[0];
          ctx.font = `${Math.round(13 * scaleFactor)}px "JetBrains Mono", monospace`;
          ctx.fillText(b.glyph, centerX + b.x * scaleFactor, centerY + b.y * scaleFactor);
        }

        ctx.restore();
      }
    }

    /**
     * ============================================================================
     * MODULE 4: 3D ASCII MATHEMATICAL PROJECTION RENDERER (renderer.js)
     * Handles 3D rotation matrices, perspective projection, depth sorting, & glow
     * ============================================================================
     */
    class Ascii3DRenderer {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.width = 0;
        this.height = 0;
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.points = AsciiObjectFactory.generate(AppState.model, AppState.density);
        this.resize();
      }

      rebuildModel() {
        this.points = AsciiObjectFactory.generate(AppState.model, AppState.density);
      }

      resize() {
        const rect = this.canvas.parentElement.getBoundingClientRect();
        this.width = rect.width;
        this.height = rect.height;
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.canvas.width = Math.round(this.width * this.dpr);
        this.canvas.height = Math.round(this.height * this.dpr);
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      }

      render(particleEngine, time) {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;
        const theme = THEMES[AppState.theme];

        ctx.clearRect(0, 0, w, h);

        // 1. Ambient Nebula Radial Glow behind 3D Object
        const centerX = w * 0.5;
        const centerY = h * 0.43;
        const scaleFactor = (Math.min(w, h * 0.72) / 360) * AppState.zoom;

        const nebula = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 210 * scaleFactor);
        nebula.addColorStop(0, theme.bgGlow);
        nebula.addColorStop(1, 'rgba(3, 5, 10, 0)');
        ctx.fillStyle = nebula;
        ctx.fillRect(0, 0, w, h);

        // 2. Render Background Twinkling Stars & Shooting Stars
        particleEngine.renderBackground(ctx, w, h, time);

        // 3. 3D Rotation Matrices (X, Y, Z)
        const cosX = Math.cos(AppState.rotX);
        const sinX = Math.sin(AppState.rotX);
        const cosY = Math.cos(AppState.rotY);
        const sinY = Math.sin(AppState.rotY);
        const cosZ = Math.cos(AppState.rotZ);
        const sinZ = Math.sin(AppState.rotZ);

        // Heartbeat pulse effect if model is Cyber Heart
        const beatScale = AppState.model === 'heart'
          ? 1 + 0.08 * Math.pow(Math.sin(time * 4.2), 4)
          : 1.0;

        const fov = 460;
        const projected = [];

        // Light vector (from top-front-right)
        const lx = 0.45, ly = -0.55, lz = 0.7;

        for (let i = 0; i < this.points.length; i++) {
          const p = this.points[i];

          // Formation progress filter (smoothly constructs object from bottom to top)
          if (p.order > AppState.formationProgress * 1.15) continue;

          const formScale = Math.min(1, (AppState.formationProgress * 1.15 - p.order + 0.15) * 4);
          let x = p.x * beatScale * formScale;
          let y = p.y * beatScale * formScale;
          let z = p.z * beatScale * formScale;

          // Rotate around Y axis
          let x1 = x * cosY - z * sinY;
          let z1 = z * cosY + x * sinY;

          // Rotate around X axis
          let y2 = y * cosX - z1 * sinX;
          let z2 = z1 * cosX + y * sinX;

          // Rotate around Z axis
          let x3 = x1 * cosZ - y2 * sinZ;
          let y3 = y2 * cosZ + x1 * sinZ;

          // Rotate Normal for dynamic directional lighting
          let nx1 = p.nx * cosY - p.nz * sinY;
          let nz1 = p.nz * cosY + p.nx * sinY;
          let ny2 = p.ny * cosX - nz1 * sinX;
          let nz2 = nz1 * cosX + p.ny * sinX;

          const diffuse = Math.max(0.18, nx1 * lx + ny2 * ly + nz2 * lz);

          // Perspective Projection
          const depth = fov + z2;
          if (depth <= 40) continue;
          const persp = (fov / depth) * scaleFactor;

          projected.push({
            sx: centerX + x3 * persp,
            sy: centerY + y3 * persp,
            z: z2,
            persp,
            diffuse,
            point: p
          });
        }

        // 4. Painter's Algorithm Depth Sorting (Back-to-Front)
        projected.sort((a, b) => a.z - b.z);

        // 5. Render 3D ASCII Glyphs with Shading & Glow
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const baseFontSize = Math.max(7, Math.round(10.5 * scaleFactor));
        const glowMult = AppState.glowIntensity;

        for (let i = 0; i < projected.length; i++) {
          const item = projected[i];
          const p = item.point;

          // Depth fog & brightness
          const depthAlpha = Math.max(0.28, Math.min(1, (160 - item.z) / 280));
          const fontSize = Math.max(6, Math.round(baseFontSize * (item.persp / scaleFactor)));

          let color = theme.primary[2];
          let glowColor = null;
          let char = p.char;
          let alpha = depthAlpha;

          if (p.role === 'foliage') {
            const shadeIdx = Math.min(
              theme.primary.length - 1,
              Math.floor(item.diffuse * theme.primary.length)
            );
            color = theme.primary[shadeIdx];
            if (item.diffuse > 0.78 && glowMult > 0.2) {
              glowColor = color;
            }
          } else if (p.role === 'trunk') {
            color = '#92400e';
          } else if (p.role === 'star') {
            const pulse = 0.7 + 0.3 * Math.sin(time * 5.5);
            color = theme.secondary[0];
            glowColor = theme.secondary[1];
            alpha = Math.min(1, depthAlpha * (0.85 + 0.3 * pulse));
          } else if (p.role === 'light') {
            // Blinking rhythmic fairy lights
            const blink = Math.sin(time * 4.5 + p.lightIndex * 1.65);
            const palette = [theme.accentA, theme.secondary[0], theme.accentB, theme.primary[3]];
            color = palette[p.lightIndex % palette.length];
            if (blink > 0.15) {
              glowColor = color;
              alpha = 1.0;
              char = blink > 0.7 ? '✦' : '*';
            } else {
              alpha = depthAlpha * 0.45;
            }
          } else if (p.role === 'ornament') {
            const palette = [theme.accentA, theme.secondary[0], theme.accentB, '#f472b6'];
            color = palette[p.lightIndex % palette.length];
            glowColor = color;
          } else if (p.role === 'giftRed') {
            color = theme.accentA;
          } else if (p.role === 'giftBlue') {
            color = theme.accentB;
          } else if (p.role === 'giftGold') {
            color = theme.secondary[1];
          } else if (p.role === 'ribbon') {
            color = theme.secondary[0];
            glowColor = theme.secondary[0];
          } else if (p.role === 'ocean') {
            color = item.diffuse > 0.55 ? '#0284c7' : '#0369a1';
          }

          ctx.globalAlpha = alpha;
          ctx.font = `700 ${fontSize}px "JetBrains Mono", monospace`;

          if (glowColor && glowMult > 0) {
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 8 * glowMult;
          } else {
            ctx.shadowBlur = 0;
          }

          ctx.fillStyle = color;
          ctx.fillText(char, item.sx, item.sy);
        }
        ctx.restore();

        // 6. Render Foreground Snow / Orbiting Sparks
        particleEngine.renderForegroundParticles(ctx, w, h, centerX, centerY, scaleFactor, time);

        // 7. Render Cinematic Typography below the 3D Object
        this.renderCinematicText(ctx, w, h, time, theme);

        return projected.length;
      }

      renderCinematicText(ctx, w, h, time, theme) {
        if (AppState.textRevealProgress <= 0.01) return;

        const text = (AppState.caption || '').toUpperCase();
        if (!text) return;

        const chars = text.split('');
        const visibleCount = Math.floor(chars.length * AppState.textRevealProgress);

        // Position cleanly in the lower breathing room of the 3D viewport
        const textY = h * 0.895;
        const maxTextWidth = w * 0.88;
        const idealSpacing = Math.min(20, maxTextWidth / Math.max(1, chars.length));
        const fontSize = Math.max(12, Math.min(21, Math.round(idealSpacing * 1.18)));

        const totalWidth = (chars.length - 1) * idealSpacing;
        const startX = w * 0.5 - totalWidth * 0.5;

        ctx.save();
        ctx.font = `800 ${fontSize}px "JetBrains Mono", monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Subtle horizontal light flare behind text
        const flare = ctx.createLinearGradient(startX - 20, textY, startX + totalWidth + 20, textY);
        flare.addColorStop(0, 'rgba(0,0,0,0)');
        flare.addColorStop(0.5, 'rgba(251, 191, 36, 0.08)');
        flare.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = flare;
        ctx.fillRect(0, textY - 18, w, 36);

        for (let i = 0; i < visibleCount; i++) {
          const ch = chars[i];
          if (ch === ' ') continue;

          // Letter-by-letter pop-in & gentle harmonic wave
          const charAge = Math.min(1, (AppState.textRevealProgress * chars.length - i) * 0.8);
          const waveY = Math.sin(time * 2.8 + i * 0.35) * 2.2;
          const x = startX + i * idealSpacing;
          const y = textY + waveY - (1 - charAge) * 8;

          // Alternating Gold & Crimson Red (or active theme colors)
          const isEven = i % 2 === 0;
          const color = isEven ? theme.textPrimary : theme.textSecondary;

          ctx.globalAlpha = charAge;
          ctx.fillStyle = color;
          ctx.shadowColor = color;
          ctx.shadowBlur = 12 * AppState.glowIntensity;

          ctx.fillText(ch, x, y);
        }

        // Blinking terminal cursor at the end of the text
        if (Math.sin(time * 6) > 0 && visibleCount > 0) {
          const cursorX = startX + Math.min(chars.length, visibleCount) * idealSpacing + 4;
          ctx.globalAlpha = 0.85;
          ctx.fillStyle = theme.textPrimary;
          ctx.fillText('_', cursorX, textY);
        }

        ctx.restore();
      }
    }

      renderScript(model) {
        const scripts = this.getScripts();
        const script = scripts[model] || scripts.tree;
        this.filenameEl.textContent = script.filename;

        this.container.innerHTML = script.lines
          .map(
            (html, idx) => `
            <div class="code-line" data-line="${idx}">
              <span class="line-num">${idx + 1}</span>
              <span class="code-text">${html}</span>
            </div>`
          )
          .join('');
        this.lastModel = model;
        this.lastActiveLine = -1;
      }

      update(time, vertexCount) {
        if (this.lastModel !== AppState.model) {
          this.renderScript(AppState.model);
        }

        // Determine currently executing line based on animation phase
        let activeLine = 6;
        let phaseLabel = 'PROJECT_3D_MATRIX';

        if (AppState.formationProgress < 0.92) {
          activeLine = Math.min(3, Math.floor(AppState.formationProgress * 4));
          phaseLabel = 'BUILD_3D_TOPOLOGY';
        } else if (AppState.textRevealProgress < 0.98) {
          activeLine = 7;
          phaseLabel = 'REVEAL_CINEMATIC_TEXT';
        } else {
          // Cycle smoothly across lighting, particles, projection, and text lines
          const cycle = Math.floor(time * 2.2) % 4;
          activeLine = 4 + cycle;
          const labels = ['LIGHTING_SHADER', 'PARTICLE_VORTEX', '3D_PERSPECTIVE', 'CINEMATIC_GLOW'];
          phaseLabel = labels[cycle];
        }

        if (activeLine !== this.lastActiveLine) {
          const prev = this.container.querySelector('.code-line.active-exec');
          if (prev) prev.classList.remove('active-exec');
          const curr = this.container.querySelector(`.code-line[data-line="${activeLine}"]`);
          if (curr) curr.classList.add('active-exec');
          this.lastActiveLine = activeLine;
        }

        this.fpsEl.textContent = AppState.fps;
        this.vertsEl.textContent = `GLYPHS: ${vertexCount} | DEPTH-SORT: PAINTER`;
        this.phaseEl.textContent = `PHASE: ${phaseLabel}`;
      }
    }

    /**
     * ============================================================================
     * MODULE 6: INTERACTIVE CONTROLS & MAIN LOOP (script.js)
     * ============================================================================
     */
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('ascii-canvas');
      const canvasContainer = document.getElementById('canvas-container');
      const renderer = new Ascii3DRenderer(canvas);
      const particles = new ParticleEngine();
      const codeEditor = new CodeEditorVisualizer();

      // Replay formation & cinematic text sequence
      function triggerReplay(withBurst = true) {
        AppState.formationProgress = 0;
        AppState.textRevealProgress = 0;
        if (withBurst) {
          setTimeout(() => particles.triggerSparkBurst(30), 650);
        }
      }

      triggerReplay(true);

      // Resize Handling (Retina / iPad / iPhone / Desktop)
      window.addEventListener('resize', () => {
        renderer.resize();
      });

      // Touch & Mouse Drag to Spin 3D Object
      function onPointerDown(clientX, clientY) {
        AppState.isDragging = true;
        AppState.lastPointerX = clientX;
        AppState.lastPointerY = clientY;
        AppState.velocityY = 0;
      }

      function onPointerMove(clientX, clientY) {
        if (!AppState.isDragging) return;
        const dx = clientX - AppState.lastPointerX;
        const dy = clientY - AppState.lastPointerY;
        AppState.rotY += dx * 0.0085;
        AppState.rotX = Math.max(-0.85, Math.min(0.85, AppState.rotX + dy * 0.0065));
        AppState.velocityY = dx * 0.0085;
        AppState.lastPointerX = clientX;
        AppState.lastPointerY = clientY;
      }

      function onPointerUp() {
        AppState.isDragging = false;
      }

      canvasContainer.addEventListener('mousedown', (e) => onPointerDown(e.clientX, e.clientY));
      window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
      window.addEventListener('mouseup', onPointerUp);

      canvasContainer.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      canvasContainer.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) {
          onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      canvasContainer.addEventListener('touchend', onPointerUp);

      // Scroll Wheel Zoom
      canvasContainer.addEventListener('wheel', (e) => {
        e.preventDefault();
        AppState.zoom = Math.max(0.65, Math.min(1.55, AppState.zoom - e.deltaY * 0.0008));
      }, { passive: false });

      // Settings Drawer Controls
      const settingsDrawer = document.getElementById('settings-drawer');
      const openSettingsBtn = document.getElementById('open-settings-btn');
      const closeSettingsBtn = document.getElementById('close-settings-btn');
      const hideUiBtn = document.getElementById('btn-hide-ui');

      function openDrawer() {
        settingsDrawer.classList.remove('opacity-0', 'pointer-events-none');
      }

      function closeDrawer() {
        settingsDrawer.classList.add('opacity-0', 'pointer-events-none');
      }

      openSettingsBtn.addEventListener('click', openDrawer);
      closeSettingsBtn.addEventListener('click', closeDrawer);
      hideUiBtn.addEventListener('click', closeDrawer);

      // 3D Model Buttons
      const captionInput = document.getElementById('cinematic-text-input');
      document.querySelectorAll('.model-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.model-btn').forEach((b) => {
            b.className = 'model-btn px-2.5 py-2 rounded-lg border border-slate-800 bg-slate-900/80 text-slate-300 hover:border-slate-600 text-left font-medium transition flex items-center gap-1.5';
            if (b.dataset.model === 'knot') b.classList.add('col-span-2');
          });
          btn.className = 'model-btn px-2.5 py-2 rounded-lg border text-left font-medium transition flex items-center gap-1.5 bg-cyan-500/20 border-cyan-400 text-cyan-200';
          if (btn.dataset.model === 'knot') btn.classList.add('col-span-2');

          AppState.model = btn.dataset.model;
          const suggested = MODEL_DEFAULT_CAPTIONS[AppState.model];
          if (suggested) {
            AppState.caption = suggested;
            captionInput.value = suggested;
          }
          renderer.rebuildModel();
          triggerReplay(true);
        });
      });

      // Custom Caption Input
      document.getElementById('apply-text-btn').addEventListener('click', () => {
        AppState.caption = captionInput.value.trim() || 'ASCII 3D 2026';
        AppState.textRevealProgress = 0;
        closeDrawer();
      });

      captionInput.addEventListener('input', () => {
        AppState.caption = captionInput.value;
      });

      // Color Theme Buttons
      document.querySelectorAll('.theme-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.theme-btn').forEach((b) => {
            b.className = 'theme-btn px-2.5 py-1.5 rounded-lg border border-slate-800 bg-slate-900/80 text-slate-300 text-[11px] font-medium transition';
          });
          btn.className = 'theme-btn px-2.5 py-1.5 rounded-lg border bg-emerald-500/20 border-emerald-400 text-emerald-200 text-[11px] font-medium transition';

      // Particles Toggle

      // Play / Pause Button

        if (AppState.isPlaying) {
          playPauseBtn.textContent = '⏸ Pause';
          statusText.textContent = 'RUNNING';
          statusDot.classList.remove('bg-amber-400');
          statusDot.classList.add('bg-emerald-400');
        } else {
          playPauseBtn.textContent = '▶ Play';
          statusText.textContent = 'PAUSED';
          statusDot.classList.remove('bg-emerald-400');
          statusDot.classList.add('bg-amber-400');
        }
      });

      // Reset / Replay Button
      document.getElementById('btn-reset').addEventListener('click', () => {
        AppState.rotX = 0.12;
        AppState.rotY = 0;
        AppState.rotZ = 0;
        AppState.zoom = 1.0;
        triggerReplay(true);
        closeDrawer();
      });

      // High-Precision Animation Loop (requestAnimationFrame)
      let lastTimestamp = performance.now();
      let frameCounter = 0;
      let fpsTimer = 0;

      function animate(now) {
        requestAnimationFrame(animate);

        const rawDt = (now - lastTimestamp) / 1000;
        lastTimestamp = now;
        const dt = Math.min(rawDt, 0.05);

        // FPS Calculation
        frameCounter++;
        fpsTimer += rawDt;
        if (fpsTimer >= 0.5) {
          AppState.fps = Math.min(60, Math.round(frameCounter / fpsTimer));
          frameCounter = 0;
          fpsTimer = 0;
        }

        if (AppState.isPlaying) {
          AppState.elapsedTime += dt;

          // 1. Progress 3D Object Formation (0 -> 1 over ~1.4 seconds)
          if (AppState.formationProgress < 1) {
            AppState.formationProgress = Math.min(1, AppState.formationProgress + dt * 0.75);
          }

          // 2. Progress Cinematic Text Reveal once object is mostly formed
          if (AppState.formationProgress > 0.72 && AppState.textRevealProgress < 1) {
            AppState.textRevealProgress = Math.min(1, AppState.textRevealProgress + dt * 0.65);
          }

          // 3. Continuous 3D Rotation + Inertia
          if (!AppState.isDragging) {
            AppState.rotY += dt * 0.75 * AppState.rotationSpeed + AppState.velocityY;
            AppState.velocityY *= 0.92;
            // Subtle breathing tilt on X and Z axes
            AppState.rotX = 0.12 + Math.sin(AppState.elapsedTime * 0.7) * 0.06;
            AppState.rotZ = Math.sin(AppState.elapsedTime * 0.5) * 0.035;
          }

          particles.update(dt, AppState.elapsedTime);
        }

        const renderedCount = renderer.render(particles, AppState.elapsedTime);
        codeEditor.update(AppState.elapsedTime, renderedCount);
      }

      requestAnimationFrame(animate);
    });
  </script>
</body>
